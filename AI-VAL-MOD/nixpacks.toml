[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "gcc", "libstdcxx5"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install -r requirements.txt"
]

[start]
# Railway injects MODULE env var: "roadmap" for Roadmap service, anything else = Validation
cmd = "sh -c 'if [ \"$MODULE\" = \"roadmap\" ]; then cd Roadmap-Module/app && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1; else cd Validation-Module/app && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1; fi'"
