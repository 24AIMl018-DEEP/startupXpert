[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.setuptools", "gcc", "libstdcxx5"]

[phases.install]
cmds = [
  "python3.11 -m pip install --upgrade pip setuptools wheel",
  "python3.11 -m pip install -r requirements.txt"
]

[start]
cmd = "sh -c 'if [ \"$MODULE\" = \"roadmap\" ]; then cd Roadmap-Module/app && python3.11 -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1; else cd Validation-Module/app && python3.11 -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1; fi'"
